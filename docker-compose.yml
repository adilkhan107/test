# Whole stack locally:  docker compose up --build
# Frontend: http://localhost:5173   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nirmaan
      POSTGRES_PASSWORD: nirmaan
      POSTGRES_DB: nirmaanai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirmaan"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://nirmaan:nirmaan@db:5432/nirmaanai
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [appdata:/data]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]

volumes:
  pgdata:
  appdata:
