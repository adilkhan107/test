# Render Blueprint. Check current plan names/prices on render.com before deploying.
# The YOLO model needs roughly 2 GB RAM, so the API cannot run on the smallest plans.
databases:
  - name: nirmaanai-db
    plan: free            # free Postgres on Render expires; use a paid plan for real use

services:
  - type: web
    name: nirmaanai-api
    runtime: docker
    rootDir: backend
    plan: standard        # ~2 GB RAM. Persistent disks need a paid plan.
    healthCheckPath: /api/health
    disk:
      name: nirmaanai-data
      mountPath: /data    # violation snapshots live here
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: nirmaanai-db, property: connectionString }
      - key: CORS_ORIGINS
        sync: false       # set to your frontend URL, e.g. https://nirmaanai-web.onrender.com
      - key: MODEL_REVISION
        sync: false       # optional: pin a commit hash of the Hugging Face model repo

  - type: web
    name: nirmaanai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false       # set to your API URL, e.g. https://nirmaanai-api.onrender.com
